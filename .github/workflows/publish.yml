name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - version: "1.20.1"
            java: "21"
            task: ":build"
            files: "build/libs/world-copies*.jar"
            mc_version: "1.20.1"
          - version: "1.21.1"
            java: "21"
            task: ":v1.21.1:build"
            files: "versions/1.21.1/build/libs/world-copies*.jar"
            mc_version: "1.21.1"
          - version: "26.2"
            java: "21"
            task: "-p versions/26.2 build"
            files: "versions/26.2/build/libs/world-copies*.jar"
            mc_version: "26.2"
          - version: "26.3-snapshot"
            java: "21"
            task: "-p versions/26.3 build"
            files: "versions/26.3/build/libs/world-copies*.jar"
            mc_version: "26.3-snapshot"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew ${{ matrix.task }}

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: world-copies-everything
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1665953
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.files }}
          name: ${{ github.event.release.name }} - ${{ matrix.mc_version }}
          version: ${{ github.event.release.tag_name }}+${{ matrix.mc_version }}
          loaders: fabric
          game-versions: ${{ matrix.mc_version }}

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
